# Take RC from MSP_SET_RAW_RC, as on the real drone, instead of the SITL UDP feed.
feature -RX_UDP
feature RX_MSP
feature -GPS
# ARM on AUX1 (channel 5), matching the platform's channel map.
aux 0 0 0 1700 2100 0 0
# MSP on UART2 (tcp://:5762) too, to inspect the FC while the platform holds UART1.
serial 1 1 115200 57600 0 115200
